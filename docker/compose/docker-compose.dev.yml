services:
  api:
    build:
      context: ../..
      dockerfile: docker/api.Dockerfile
    command: ["uvicorn", "orchestrasecai.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes:
      - ../../apps/api/src:/app/src
      - ../../apps/api/alembic:/app/alembic

  worker:
    volumes:
      - ../../apps/api/src:/app/src

  web:
    build:
      context: ../..
      dockerfile: docker/web.Dockerfile
    command: ["npm", "run", "dev"]
    volumes:
      - ../../apps/web:/app
      - /app/node_modules
      - /app/.next
    environment:
      NODE_ENV: development
