# Optional vLLM profile — requires NVIDIA GPU
services:
  vllm:
    image: vllm/vllm-openai:latest
    profiles: ["gpu"]
    ports:
      - "8080:8000"
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN:-}
    command: >
      --model ${VLLM_MODEL:-meta-llama/Llama-3.1-8B-Instruct}
      --host 0.0.0.0
      --port 8000
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - backend

  api:
    environment:
      VLLM_BASE_URL: http://vllm:8000/v1
      MOCK_AI: "false"

  worker:
    environment:
      VLLM_BASE_URL: http://vllm:8000/v1
      MOCK_AI: "false"
